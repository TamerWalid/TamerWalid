<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 230" width="1120" height="230">
  <defs>
    <!-- تدرج الخلفية الداكنة للأشكال الهندسية -->
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>

    <!-- تدرج الشريط الأفقي الرئيسي -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="50%" stop-color="#1f1f1f" />
      <stop offset="100%" stop-color="#292929" />
    </linearGradient>

    <!-- تدرج الحافة العلوية في يمين الشريط -->
    <linearGradient id="topBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="50%" stop-color="#2d2d2d" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>

    <!-- تدرج معدني فضي لشعار TW -->
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9d9d9" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#9e9e9e" />
      <stop offset="100%" stop-color="#cfcfcf" />
    </linearGradient>

    <!-- ظل خفيف لإبراز الأبعاد -->
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. الشريط الأفقي الخلفي -->
  <g filter="url(#dropShadow)">
    <polygon points="275,52 1110,52 1110,182 275,182 325,117" fill="url(#bannerGrad)" stroke="#121212" stroke-width="2" />
    <!-- الزخرفة العلوية في يمين الشريط -->
    <polygon points="790,52 1095,52 1070,76 815,76" fill="url(#topBevel)" />
    <!-- خط إضاءة علوي خفيف -->
    <line x1="280" y1="53" x2="1108" y2="53" stroke="#4a4a4a" stroke-width="1.5" />
  </g>

  <!-- 2. السهم الأوسط (Chevron) -->
  <g filter="url(#dropShadow)">
    <polygon points="185,10 245,10 342,117 245,224 185,224 282,117" fill="url(#darkMetal)" stroke="#141414" stroke-width="1.5" />
    <polyline points="187,11 244,11 340,117" fill="none" stroke="#555555" stroke-width="1.2" />
  </g>

  <!-- 3. الدرع الأيسر الحامل للشعار -->
  <g filter="url(#dropShadow)">
    <path d="M 10,10 L 155,10 L 252,117 L 155,224 L 45,224 C 22,224 10,210 10,185 Z" fill="url(#darkMetal)" stroke="#141414" stroke-width="1.5" />
    <path d="M 12,11 L 154,11 L 250,117" fill="none" stroke="#555555" stroke-width="1.2" />
  </g>

  <!-- 4. شعار الحروف المتداخلة TW -->
  <g fill="url(#silverMetal)" stroke="#1c1c1c" stroke-width="1.8" stroke-linejoin="round">
    <!-- حرف T -->
    <path d="M 32,42 
             L 132,42 
             C 132,58 134,68 140,68 
             C 143,68 145,65 143,62 
             C 146,62 148,66 146,70 
             C 143,74 135,73 130,66 
             C 125,59 123,52 115,52 
             L 90,52 
             L 90,152 
             C 90,160 95,163 101,164 
             L 101,168 
             L 63,168 
             L 63,164 
             C 69,163 74,160 74,152 
             L 74,52 
             L 49,52 
             C 41,52 39,59 34,66 
             C 29,73 21,74 18,70 
             C 16,66 18,62 21,62 
             C 19,65 21,68 24,68 
             C 30,68 32,58 32,42 Z" />

    <!-- حرف W المتداخل -->
    <path d="M 18,76 
             L 53,76 
             L 53,80 
             C 47,81 45,84 47,91 
             L 61,144 
             L 82,76 
             L 86,76 
             L 107,144 
             L 121,91 
             C 123,84 121,81 115,80 
             L 115,76 
             L 150,76 
             L 150,80 
             C 144,81 141,85 139,93 
             L 114,178 
             C 112,184 114,187 117,187 
             C 119,187 120,185 119,183 
             C 122,183 124,186 122,190 
             C 120,193 114,193 111,188 
             C 109,185 108,180 106,174 
             L 84,104 
             L 62,174 
             C 60,180 59,185 57,188 
             C 54,193 48,193 46,190 
             C 44,186 46,183 49,183 
             C 48,185 49,187 51,187 
             C 54,187 56,184 54,178 
             L 29,93 
             C 27,85 24,81 18,80 Z" />
  </g>

  <!-- 5. النصوص (الاسم والمسمى الوظيفي) -->
  <text x="375" y="138" fill="#ffffff" font-family="&#39;Montserrat&#39;, &#39;Segoe UI&#39;, Arial, sans-serif" font-weight="700" font-size="54" letter-spacing="2">TAMER WALID</text>

  <text x="795" y="135" fill="#f0f0f0" font-family="&#39;Montserrat&#39;, &#39;Segoe UI&#39;, Arial, sans-serif" font-weight="400" font-size="27" letter-spacing="1.2">SOFTWARE ENGINEER</text>
</svg>